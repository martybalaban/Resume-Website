<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marty Balaban – Career Walk</title>
<style>
  :root { --ink:#1b1f2a; --card:rgba(255,255,255,.92); --accent:#3b6fe0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#111; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  canvas { display:block; width:100vw; height:100vh; }
  #title { position:fixed; top:14px; left:18px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.5); }
  #title h1 { margin:0; font-size:20px; letter-spacing:.04em; }
  #title p { margin:2px 0 0; font-size:13px; opacity:.9; }
  #timeline { position:fixed; top:14px; right:18px; width:min(560px,55vw); }
  #timeline .bar { display:flex; gap:3px; height:8px; }
  #timeline .seg { flex:1; background:rgba(255,255,255,.35); border-radius:4px; overflow:hidden; }
  #timeline .seg i { display:block; height:100%; width:0; background:#fff; }
  #timeline .labels { display:flex; margin-top:5px; font-size:11px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #timeline .labels span { text-align:center; opacity:.65; white-space:nowrap; font-size:10px; }
  #timeline .labels span.on { opacity:1; font-weight:700; }
  #year { position:fixed; top:56px; right:18px; font-size:34px; font-weight:800; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.5); }
  #card { position:fixed; left:18px; bottom:18px; width:min(440px,calc(100vw - 36px)); background:var(--card); border-radius:14px; padding:16px 18px; box-shadow:0 8px 30px rgba(0,0,0,.25); transition:opacity .25s; }
  #card.swap { opacity:0; }
  #card h2 { margin:0; font-size:18px; }
  #card .role { margin:2px 0 8px; font-size:13px; color:#555; }
  #card ul { margin:0; padding-left:18px; font-size:13.5px; line-height:1.45; }
  #card .chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  #card .chips span { font-size:11.5px; background:#e9eefc; color:#2a47a0; padding:3px 8px; border-radius:99px; }
  #hint { position:fixed; left:50%; top:38%; transform:translateX(-50%); color:#fff; font-size:16px; background:rgba(0,0,0,.45); padding:10px 18px; border-radius:99px; transition:opacity .6s; pointer-events:none; }
  #hint.gone { opacity:0; }
  #pad { position:fixed; right:18px; bottom:18px; display:none; gap:10px; }
  #pad button { width:64px; height:64px; border-radius:50%; border:0; font-size:26px; background:rgba(255,255,255,.85); touch-action:none; }
  @media (pointer:coarse) { #pad { display:flex; } #card { bottom:100px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>MARTY J. BALABAN</h1><p>Mobile &amp; AI engineering leader</p></div>
<div id="timeline"><div class="bar"></div><div class="labels"></div></div>
<div id="year"></div>
<div id="card"></div>
<div id="hint">Walk with → / D (hold Shift to run) — or the on-screen buttons</div>
<div id="pad"><button id="bl">◀</button><button id="br">▶</button></div>

<script>
// ---------- Content (from resume) ----------
const STAGES = [
  { id:'juniata', name:'Juniata College', short:'College', role:'B.S. Computer Science · Huntingdon, PA', years:null,
    bullets:['Where it started: a Computer Science degree in the hills of central Pennsylvania.'],
    chips:[],
    pal:{ top:'#f6b98a', bot:'#cfe4f2', ground:'#7da25a', path:'#b9a88a' } },
  { id:'kodak', name:'Eastman Kodak Company', short:'Kodak', role:'Software Engineer', years:[2008,2012],
    bullets:['Part of a small team building the Kodak Moments suite of apps.','Developed new features for the Kodak Picture Kiosk software, end to end.','Custom widgets and complex workflows, with a strict focus on usability.'],
    chips:['iOS SDK','C# / .NET','SQL Server','WinForms','Balabanimation (2009–now)'],
    pal:{ top:'#ececec', bot:'#ffffff', ground:'#2b2b2f', path:'#1b1b1e' } },
  { id:'alaris', name:'Kodak Alaris', short:'Alaris', role:'Senior Mobile Software Engineer', years:[2012,2017],
    bullets:['Principal architect of Kiosk Connect and My Kodak Moments for Android.','Built white-label versions of the apps for business clients.','Managed a large creative-content process for personalized photo products.'],
    chips:['iOS SDK','Android SDK','Genuent (2015–16)','Precision Group (2016–17)','Planned Parenthood (2016–17)'],
    pal:{ top:'#f1f1f1', bot:'#ffffff', ground:'#1d1d20', path:'#111113' } },
  { id:'teltech', name:'Teltech (Mosaic Group / IAC)', short:'Teltech', role:'Senior Engineer → Lead Mobile → Eng. Manager → Director of Engineering', years:[2017,2023],
    bullets:['Principal developer on Spoofcard iOS (Swift) and Android (Java).','Took Robokiller Android (Kotlin) to MVP and market in 3 months.','Automated builds for the whole app suite; led iOS and Android teams.'],
    chips:['Swift','Kotlin','Jetpack Compose','GraphQL','Bitrise CI/CD','Stealth startup (2021–24)'],
    pal:{ top:'#2f80d0', bot:'#eaf5ff', ground:'#dfe8f0', path:'#bccbd9' } },
  { id:'omada', name:'Omada Health', short:'Omada', role:'Engineering Manager', years:[2023,2026],
    bullets:['Lead nine engineers across iOS, Android, backend and AI infrastructure.','Shipped Omada’s first AI food features: image recognition, barcode scan, speech-to-text, chat.','Built AI quality controls, weekly mobile releases, and Monte Carlo delivery forecasting.'],
    chips:['AI infrastructure','LLM evals','Staged rollouts','Forecasting'],
    pal:{ top:'#f59a6c', bot:'#fff0e6', ground:'#ee7a50', path:'#f9cdb5' } },
  { id:'sequencing', name:'Sequencing', short:'Sequencing', role:'Senior Engineering Manager, AI Platform', years:[2026,2026], present:true,
    bullets:[], chips:[],
    pal:{ top:'#8f7ae0', bot:'#e9f0ff', ground:'#4b3f9e', path:'#2e2a70' } },
];
const yrs = s => `${s.years[0]}–${s.present?'Present':s.years[1]}`;
const N = STAGES.length, SIGN = 420;               // sign (and scenery cut) sits SIGN px into each stage
const PX_PER_YEAR = 250;                           // walking distance is proportional to time spent
const YEARS = s => s.id==='juniata' ? 4 : s.present ? 2/12 : s.years[1]-s.years[0];                          // college = 4 yrs; current role just started (~2 months)
const LEN = STAGES.map(s => Math.max(150, YEARS(s)*PX_PER_YEAR));   // 150px minimum so the short current role is still visible
const START = LEN.map((_,i)=>LEN.slice(0,i).reduce((a,b)=>a+b,0));                                              // world x where each stage begins
const SPAN0 = i => i ? START[i]+SIGN : 0, SPAN1 = i => i<N-1 ? START[i+1]+SIGN : START[i]+LEN[i]+SIGN;          // avatar-world range of each stage
const maxX = () => Math.max(0, SPAN1(N-1) - W*.6);   // stop where the avatar reaches the end of the last stage

// ---------- Setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, S, DPR;                                   // logical height is always 600
function resize(){ DPR=window.devicePixelRatio||1; cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; S=innerHeight/600; W=innerWidth/S; H=600; }
addEventListener('resize', resize); resize();
const GROUND = 440;

const rnd = (i,k=0)=>{ const s=Math.sin(i*127.1+k*311.7)*43758.5453; return s-Math.floor(s); };
const lerp = (a,b,t)=>a+(b-a)*t;
const hex = h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix = (a,b,t)=>{ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`; };
const smooth = t=>t*t*(3-2*t);
function tiles(cam, spacing, fn){
  const m = 400; let i = Math.floor((cam-m)/spacing);
  for(; i*spacing-cam < W+m; i++) fn(i*spacing-cam, i);
}
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function circ(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
function rrect(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
function windows(x,y,w,h,cols,rows,on,off,seed){
  const gw=w/(cols*2+1), gh=h/(rows*2+1);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) rect(x+gw*(1+c*2), y+gh*(1+r*2), gw, gh, rnd(seed+r*9+c,3)>.35?on:off);
}

// ---------- Scenery per stage: far / mid / near layers ----------
const SCENE = {
  juniata:{
    far(cam){ ctx.fillStyle='#9fb9b0'; ctx.beginPath(); ctx.moveTo(0,GROUND);
      for(let x=0;x<=W;x+=20){ const w=x+cam; ctx.lineTo(x, GROUND-90-Math.sin(w*.004)*45-Math.sin(w*.011)*18); } ctx.lineTo(W,GROUND); ctx.fill(); },
    mid(cam){ tiles(cam,520,(x,i)=>{ const h=110+rnd(i)*70, w=170+rnd(i,1)*60;
        rect(x,GROUND-h,w,h,'#a4533c'); rect(x-6,GROUND-h-10,w+12,12,'#6d3a2c');
        windows(x,GROUND-h,w,h,4,Math.floor(h/32),'#ffe9a8','#7a3f2f',i*7);
        if(rnd(i,5)>.55){ rect(x+w,GROUND-h-70,34,h+70,'#a4533c'); circ(x+w+17,GROUND-h-40,11,'#f4efe2'); ctx.fillStyle='#6d3a2c'; ctx.beginPath(); ctx.moveTo(x+w-4,GROUND-h-70); ctx.lineTo(x+w+17,GROUND-h-110); ctx.lineTo(x+w+38,GROUND-h-70); ctx.fill(); }
      }); },
    near(cam){ tiles(cam,300,(x,i)=>{ const k=rnd(i,2); if(k<.6){ const c=['#d9622b','#c8402f','#e8a33a'][Math.floor(rnd(i,4)*3)];
          rect(x-6,GROUND-80,12,80,'#5b3d28'); circ(x,GROUND-100,46,c); circ(x-28,GROUND-80,30,c); circ(x+28,GROUND-78,30,c);
        } else { rect(x,GROUND-70,5,70,'#2d2d33'); circ(x+2,GROUND-74,8,'#ffe9a8'); }
      }); }
  },
  kodak:{
    far(cam){ tiles(cam,260,(x,i)=>{ const h=80+rnd(i)*110, w=120+rnd(i,1)*80; rect(x,GROUND-h,w,h,'#dcdcdc');
        windows(x,GROUND-h,w,h,5,Math.floor(h/26),'#ffffff','#c4c4c4',i*5);
        if(rnd(i,6)>.7){ rect(x+w*.7,GROUND-h-60,16,60,'#c4c4c4'); } }); },
    mid(cam){ tiles(cam,480,(x,i)=>{ const w=300, h=130+rnd(i)*40; rect(x,GROUND-h,w,h,'#fafafa'); rect(x,GROUND-h,w,20,'#e4231f');
        rect(x+w/2-70,GROUND-h+2,140,16,'#111'); windows(x+10,GROUND-h+30,w-20,h-40,6,2,'#2b2b2f','#555',i*3); }); },
    near(cam){ tiles(cam,340,(x,i)=>{ const k=rnd(i,2);
        if(k<.45){ // photo kiosk
          rrect(x,GROUND-110,70,110,6,'#111'); rrect(x+8,GROUND-98,54,42,3,'#fff'); rect(x+8,GROUND-46,54,6,'#e4231f'); rect(x+20,GROUND-34,30,24,'#444');
        } else if(k<.8){ // film strip fence
          rect(x,GROUND-60,200,50,'#111'); for(let f=0;f<5;f++){ rect(x+8+f*38,GROUND-52,30,34,['#e4231f','#fff','#888','#e4231f','#fff'][(i+f)%5]); }
          for(let h=0;h<14;h++){ rect(x+4+h*14,GROUND-58,6,4,'#eee'); rect(x+4+h*14,GROUND-16,6,4,'#eee'); }
        } else { rect(x,GROUND-90,5,90,'#111'); circ(x+2,GROUND-94,9,'#e4231f'); }
      }); }
  },
  alaris:{
    far(cam){ SCENE.kodak.far(cam); },
    mid(cam){ tiles(cam,480,(x,i)=>{ const w=300, h=130+rnd(i)*40; rect(x,GROUND-h,w,h,'#1b1b1e'); rect(x,GROUND-h,w,20,'#e4231f');
        rect(x+w/2-70,GROUND-h+2,140,16,'#fff'); windows(x+10,GROUND-h+30,w-20,h-40,6,2,'#ffffff','#3a3a40',i*3); }); },
    near(cam){ SCENE.kodak.near(cam); }
  },
  teltech:{
    far(cam){ tiles(cam,150,(x,i)=>{ const h=100+rnd(i)*170, w=90+rnd(i,1)*50; rect(x,GROUND-h,w,h,'#a9cdeb');
        windows(x,GROUND-h,w,h,4,Math.floor(h/24),'#ffffff','#8dbbe0',i*11); }); },
    mid(cam){ tiles(cam,360,(x,i)=>{ const h=140+rnd(i)*120, w=170; rect(x,GROUND-h,w,h,'#1f6fb5');
        windows(x,GROUND-h,w,h,5,Math.floor(h/26),'#ffffff','#195b95',i*13);
        if(rnd(i,7)>.5){ rect(x+w/2-2,GROUND-h-50,4,50,'#1f6fb5'); circ(x+w/2,GROUND-h-50,5,'#8cc63f'); } }); },
    near(cam){ tiles(cam,330,(x,i)=>{ const k=rnd(i,2);
        if(k<.5){ // giant phone
          rrect(x,GROUND-150,80,150,12,'#143f6b'); rrect(x+6,GROUND-142,68,126,6,'#ffffff'); rect(x+6,GROUND-142,68,22,'#1f6fb5');
          circ(x+40,GROUND-84,16,i%2?'#8cc63f':'#1f6fb5');
        } else { rect(x,GROUND-110,5,110,'#143f6b'); rect(x-14,GROUND-114,36,6,'#143f6b'); circ(x-8,GROUND-104,7,'#fff'); }
      }); }
  },
  omada:{
    far(cam){ ctx.fillStyle='#f8c6aa'; ctx.beginPath(); ctx.moveTo(0,GROUND);
      for(let x=0;x<=W;x+=20){ const w=x+cam; ctx.lineTo(x, GROUND-70-Math.sin(w*.005)*40-Math.sin(w*.013)*14); } ctx.lineTo(W,GROUND); ctx.fill(); },
    mid(cam){ tiles(cam,420,(x,i)=>{ const h=120+rnd(i)*110, w=150; rect(x,GROUND-h,w,h,'#fff4ec'); rect(x,GROUND-h,w,h,'rgba(238,122,80,.18)');
        for(let r=0;r<h;r+=22) rect(x,GROUND-h+r,w,2,'rgba(255,255,255,.8)');
        rect(x+w-8,GROUND-h-26,8,26,'#0f3d47'); circ(x+w-4,GROUND-h-34,12,'#ee7a50'); }); },
    near(cam,t){ // AI node network + plants
      tiles(cam,300,(x,i)=>{ if(rnd(i,2)<.6){ rect(x-3,GROUND-60,6,60,'#0f3d47'); circ(x-14,GROUND-64,16,'#ee7a50'); circ(x+14,GROUND-70,18,'#f39468'); circ(x,GROUND-88,16,'#f7ac86'); }
        else { rrect(x-20,GROUND-40,40,40,6,'#fff'); rect(x-2,GROUND-130,4,92,'#0f3d47'); } });
      tiles(cam*1.0,220,(x,i)=>{ const y=GROUND-190-rnd(i)*110, nx=x+220, ny=GROUND-190-rnd(i+1)*110;
        ctx.strokeStyle='rgba(238,122,80,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,y+Math.sin(t*2+i)*4); ctx.lineTo(nx,ny+Math.sin(t*2+i+1)*4); ctx.stroke();
        circ(x,y+Math.sin(t*2+i)*4,6,'#0f3d47'); });
    }
  },
  sequencing:{
    far(cam){ ctx.fillStyle='#b9acee'; ctx.beginPath(); ctx.moveTo(0,GROUND);
      for(let x=0;x<=W;x+=20){ const w=x+cam; ctx.lineTo(x, GROUND-80-Math.sin(w*.005)*40-Math.sin(w*.013)*14); } ctx.lineTo(W,GROUND); ctx.fill(); },
    mid(cam){ tiles(cam,400,(x,i)=>{ const h=130+rnd(i)*130, w=140; const g=ctx.createLinearGradient(0,GROUND-h,0,GROUND); g.addColorStop(0,'#5a4bc4'); g.addColorStop(1,'#2f5fc8');
        ctx.fillStyle=g; ctx.fillRect(x,GROUND-h,w,h); windows(x,GROUND-h,w,h,4,Math.floor(h/28),'#dfe8ff','#3f3a9a',i*17); }); },
    near(cam,t){ tiles(cam,260,(x,i)=>{ if(rnd(i,2)<.55){ // DNA helix on a stand
          rect(x-2,GROUND-30,4,30,'#2e2a70');
          for(let y=0;y<130;y+=7){ const o=Math.sin(y*.1+t*1.5+i)*16, k=y/130;
            ctx.strokeStyle='rgba(120,100,200,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-o,GROUND-30-y); ctx.lineTo(x+o,GROUND-30-y); ctx.stroke();
            circ(x+o,GROUND-30-y,3.5,'#2f6fe0'); circ(x-o,GROUND-30-y,3.5,'#8a45c8'); }
        } else { rrect(x-26,GROUND-50,52,50,8,'#fff'); rect(x-18,GROUND-42,36,22,'#2f6fe0'); circ(x,GROUND-31,7,'#8a45c8'); }
      }); }
  },
};

// sign/bld: [image key, crop rect]; bldColor = facade, roof = roof trim, panel = logo backing
const LOGO = {
  kodak:  { sign:['kodak',[0,0,469,426]],            bld:['kodak',[0,0,469,426]],            bldColor:'#e4231f', roof:'#111',    panel:'#fbb616', panelH:120 },
  alaris: { sign:['alaris',[0,60,530,90]],           bld:['alaris',[0,60,530,90]],           bldColor:'#1b1b1e', roof:'#e4231f', panel:'#ffffff', panelH:70 },
  teltech:{ sign:['teltech',[0,0,189,120]],          bld:['teltech',[0,0,189,120]],          bldColor:'#1f6fb5', roof:'#143f6b', panel:'#ffffff', panelH:90 },
  sequencing:{ sign:['sequencing',[0,0,672,128]], bld:['sequencing',[0,0,672,128]], bldColor:'#4a3f9e', roof:'#2f6fe0', panel:'#ffffff', panelH:60 },
  omada:  { sign:['omada',[60,80,490,145]],          bld:['omada',[60,80,490,145]],          bldColor:'#fffaf6', roof:'#0f3d47', panel:'#ffffff', panelH:90 },
};
const IMGS = {}; for(const k in IMG_SRC){ IMGS[k]=new Image(); IMGS[k].src=IMG_SRC[k]; }
function drawLogo(l,x,y,w,h){ const c=l[1], img=IMGS[l[0]]; if(!img.complete||!img.naturalWidth) return;
  const r=Math.min(w/c[2],h/c[3]), dw=c[2]*r, dh=c[3]*r; ctx.drawImage(img,c[0],c[1],c[2],c[3],x+(w-dw)/2,y+(h-dh)/2,dw,dh); }

// ---------- State ----------
let x = 0, vx = 0, face = 1, phase = 0, t = 0, moved = false, curStage = -1;
const keys = {};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; if(e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()] = false; });
for(const [id,k] of [['bl','pl'],['br','pr']]){ const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{keys[k]=true; e.preventDefault();}); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false)); }

// ---------- HUD ----------
const card = document.getElementById('card'), yearEl = document.getElementById('year');
const segs = [], labels = [];
{ const bar=document.querySelector('#timeline .bar'), lab=document.querySelector('#timeline .labels');
  STAGES.forEach(s=>{ const d=document.createElement('div'); d.className='seg'; d.style.flex=LEN[segs.length]; d.innerHTML='<i></i>'; bar.appendChild(d); segs.push(d.firstChild);
    const l=document.createElement('span'); l.style.flex=LEN[labels.length]; l.textContent=s.short; lab.appendChild(l); labels.push(l); }); }
function showStage(i){
  const s=STAGES[i]; card.classList.add('swap');
  setTimeout(()=>{ card.innerHTML=`<h2>${s.name}</h2><div class="role">${s.role}${s.years?` · ${yrs(s)}`:''}</div>${s.bullets.length?`<ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}${s.chips.length?`<div class="chips">${s.chips.map(c=>`<span>${c}</span>`).join('')}</div>`:''}`; card.classList.remove('swap'); },200);
  labels.forEach((l,j)=>l.classList.toggle('on',j===i));
}

// ---------- Avatar (placeholder, procedurally drawn — swap for a sprite later) ----------
function drawAvatar(px, py){
  const swing = Math.sin(phase)*(Math.abs(vx)>5?1:0), bob = Math.abs(Math.cos(phase))*(Math.abs(vx)>5?4:0);
  ctx.save(); ctx.translate(px, py - bob); ctx.scale(face*1.5, 1.5);
  ctx.lineCap='round'; ctx.lineWidth=7;
  const limb=(x0,y0,len,ang,c)=>{ ctx.strokeStyle=c; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+Math.sin(ang)*len, y0+Math.cos(ang)*len); ctx.stroke(); };
  limb(0,-34,34,-swing*.8,'#2a3350'); limb(-1,-34,34, swing*.8,'#1f2740');          // legs
  ctx.lineWidth=6; limb(0,-62,26, swing*.7,'#2f8a4a');                                 // far arm
  rrect(-11,-72,22,42,7,'#3aa05a'); rect(-6,-48,12,10,'#2f8a4a');                      // green hoodie + pocket
  limb(0,-62,26,-swing*.7,'#3aa05a');                                                  // near arm
  rect(-6,-56,12,6,'#e0b48c');                                                         // neck
  circ(-3,-90,13,'#c4481c');                                                           // back of hair
  circ(2,-85,12,'#f0c9a4'); circ(14,-84,2.5,'#f0c9a4'); circ(-3,-85,3,'#e0b48c');      // face, nose, ear
  ctx.fillStyle='#c4481c'; ctx.beginPath(); ctx.arc(1,-89,13,Math.PI*1.02,Math.PI*1.95); ctx.fill(); // fringe
  circ(9,-87,1.8,'#222');
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(px,py+2,26,6,0,0,7); ctx.fill();
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
  const dir=((keys['arrowright']||keys['d']||keys['pr'])?1:0)-((keys['arrowleft']||keys['a']||keys['pl'])?1:0);
  const speed = keys['shift'] ? 520 : 280;
  vx = lerp(vx, dir*speed, Math.min(1,dt*10));
  if(dir) { face = dir; if(!moved){ moved=true; document.getElementById('hint').classList.add('gone'); } }
  x = Math.max(0, Math.min(maxX(), x + vx*dt)); phase += Math.abs(vx)*dt*.05;

  const ax = Math.min(W*.6, x + 40);                         // avatar's screen x
  const cut = i => START[i] + SIGN - x;                           // screen x of stage i's sign = where scenery changes
  let a = 0; for(let i=1;i<N;i++) if(cut(i) <= ax) a = i;
  if(a!==curStage){ curStage=a; showStage(a); }

  ctx.setTransform(DPR*S,0,0,DPR*S,0,0);
  STAGES.forEach((s,i)=>{
    const x0 = i===0 ? -1e4 : cut(i), x1 = i===N-1 ? 1e4 : cut(i+1);
    if(x1 < -10 || x0 > W+10) return;
    ctx.save(); ctx.beginPath(); ctx.rect(x0,0,x1-x0,H); ctx.clip();
    const sc = SCENE[s.id], g=ctx.createLinearGradient(0,0,0,GROUND);
    g.addColorStop(0,s.pal.top); g.addColorStop(1,s.pal.bot); ctx.fillStyle=g; ctx.fillRect(x0,0,x1-x0,H);
    circ(W*.75 - x*.03 % (W+200), 110, 38, 'rgba(255,255,255,.55)');
    sc.far(x*.2); sc.mid(x*.5);
    const lg=LOGO[s.id];
    if(lg){ const bx=(START[i]+SIGN+LEN[i]*.45)*.5 + 300 - x*.5, bw=270, bh=230; if(bx>-bw && bx<W+50){
        rect(bx,GROUND-bh,bw,bh,lg.bldColor); rect(bx-8,GROUND-bh-10,bw+16,12,lg.roof);
        rrect(bx+30,GROUND-bh+30,bw-60,lg.panelH+16,8,lg.panel); drawLogo(lg.bld, bx+40, GROUND-bh+38, bw-80, lg.panelH);
        windows(bx+20,GROUND-70,bw-40,60,5,1,'#ffffff','#00000033',i*4); } }
    rect(0,GROUND,W,H-GROUND,s.pal.ground); rect(0,GROUND+40,W,H-GROUND-40,s.pal.path);
    ctx.fillStyle='rgba(255,255,255,.25)'; tiles(x,120,(sx)=>ctx.fillRect(sx,GROUND+95,60,5));
    sc.near(x,t);
    ctx.restore();
  });
  // stage signposts (the scenery changes right at each sign)
  STAGES.forEach((s,i)=>{ const sx=cut(i)-60; if(sx>-300&&sx<W+300){ const lg=LOGO[s.id], sh=lg?100:64, top=GROUND-110-sh+10;
      rect(sx+57,GROUND-110,6,110,'#4a3a2a'); rrect(sx-50,top,220,sh,8,'#fff'); ctx.strokeStyle='#ddd'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(sx-50,top,220,sh,8); ctx.stroke();
      ctx.fillStyle='#222'; ctx.textAlign='center';
      if(lg){ drawLogo(lg.sign,sx-40,top+6,200,52); ctx.font='bold 12px sans-serif'; ctx.fillText(s.short.toUpperCase(),sx+60,top+74); ctx.font='12px sans-serif'; ctx.fillText(s.years?`${yrs(s)}`:'',sx+60,top+90); }
      else { ctx.font='bold 16px sans-serif'; ctx.fillText(s.short.toUpperCase(),sx+60,top+28); ctx.font='13px sans-serif'; ctx.fillText('Education',sx+60,top+50); } } });
  drawAvatar(ax, GROUND+82);
  // avatar stays at 35% of screen width (until the world edge)
  if(x>=maxX()-1){ ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText("You've caught up to today ✦",W/2,160); }

  // HUD updates
  const wx = x+ax; segs.forEach((el,i)=>{ el.style.width = Math.max(0,Math.min(1,(wx-SPAN0(i))/(SPAN1(i)-SPAN0(i))))*100+'%'; });
  const s=STAGES[Math.max(0,curStage)];
  if(s.years){ const f=Math.max(0,Math.min(1,(wx-SPAN0(curStage))/(SPAN1(curStage)-SPAN0(curStage)))); yearEl.textContent=Math.floor(lerp(s.years[0],s.years[1],f)); } else yearEl.textContent='';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
